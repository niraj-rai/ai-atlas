<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG first for browsers that take it, a PNG for those that do not. Paths
         are root-relative so Vite rewrites them for a subpath deploy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS and iPadOS ignore the manifest icons for the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f1524" />
    <meta name="apple-mobile-web-app-title" content="AI Atlas" />
    <meta name="description" content="Learn the whole field by zooming into it — six maps, 353 topics, worked examples and playgrounds." />
    <title>AI Atlas — learn the field by zooming into it</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
