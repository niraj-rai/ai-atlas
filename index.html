<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG first for browsers that take it, a PNG for those that do not. Paths
         are root-relative so Vite rewrites them for a subpath deploy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS and iPadOS ignore the manifest icons for the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f1524" />
    <meta name="apple-mobile-web-app-title" content="AI Atlas" />

    <!-- Shared links. og:url and og:image must be absolute — a scraper will not
         resolve a relative path — so they come from VITE_SITE at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Atlas" />
    <meta property="og:title" content="AI Atlas — the journey from symbolic AI to AGI" />
    <meta property="og:description" content="Six zoomable maps from the maths up to the frontier: 353 topics, 488 worked examples with every number editable, and 26 playgrounds." />
    <meta property="og:url" content="%VITE_SITE%/" />
    <meta property="og:image" content="%VITE_SITE%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Atlas — a globe wired as a network, above the six era colours of the AI timeline." />
    <!-- Twitter reads og: for title and description; it needs its own card type. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE%/og.png" />
    <meta name="description" content="Six zoomable maps from the maths up to the frontier: 353 topics, 488 worked examples with every number editable, and 26 playgrounds." />
    <title>AI Atlas — the journey from symbolic AI to AGI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
