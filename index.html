<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG first for browsers that take it, a PNG for those that do not. Paths
         are root-relative so Vite rewrites them for a subpath deploy, and the
         ?v= is a hash of the icon bytes: browsers cache favicons past their
         headers, and without it a redrawn icon can sit stale for weeks. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=%ICON_V%" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=%ICON_V%" />
    <!-- iOS and iPadOS ignore the manifest icons for the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=%ICON_V%" />
    <link rel="manifest" href="/site.webmanifest?v=%ICON_V%" />
    <meta name="theme-color" content="#0f1524" />
    <meta name="apple-mobile-web-app-title" content="AI Atlas" />

    <!-- Shared links. og:url and og:image must be absolute — a scraper will not
         resolve a relative path — so they come from VITE_SITE at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Atlas" />
    <meta property="og:title" content="AI Atlas — the journey from symbolic AI to AGI" />
    <meta property="og:description" content="Seven zoomable maps from the maths up to agentic AI: 422 topics, 515 worked examples with every number editable, and 30 playgrounds." />
    <meta property="og:url" content="%VITE_SITE%/" />
    <meta property="og:image" content="%VITE_SITE%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Atlas — a globe wired as a network, above the six era colours of the AI timeline." />
    <!-- Twitter reads og: for title and description; it needs its own card type. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE%/og.png" />
    <meta name="description" content="Seven zoomable maps from the maths up to agentic AI: 422 topics, 515 worked examples with every number editable, and 30 playgrounds." />
    <title>AI Atlas — the journey from symbolic AI to AGI</title>

    <!--
      The boot skeleton below is styled here rather than in the stylesheet, so it
      paints with the document instead of waiting on anything. The main bundle is
      about 550KB over the wire — a couple of seconds on slow 4G, longer on 3G —
      and without this the page is blank white for all of it.
    -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; }
      .boot-bar {
        flex: 0 0 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line, #1d2433);
        background: var(--bg-panel, #0c1120);
      }
      .boot-mark { width: 18px; height: 18px; border-radius: 4px; background: #a78bfa; }
      .boot-name { font: 600 13px/1 system-ui, sans-serif; color: var(--text, #e6ebf5); letter-spacing: -0.01em; }
      .boot-body { flex: 1 1 auto; display: flex; min-height: 0; }
      .boot-map { flex: 1 1 auto; display: grid; gap: 8px; padding: 14px;
        grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
      /* The graph shape: a root and the column it fans out to. */
      .boot-graph { flex: 1 1 auto; display: none; align-items: center; gap: 46px; padding: 28px 34px; }
      .boot-graph .col { display: flex; flex-direction: column; gap: 14px; flex: 0 0 190px; }
      .boot-graph .card { height: 74px; border-radius: 9px; background: var(--surface-2, #161d2e);
        animation: boot-pulse 1.5s ease-in-out infinite; }
      .boot-graph .root { flex: 0 0 190px; height: 92px; }
      /* Whichever view is about to render is the one the skeleton draws. */
      .boot-globe { flex: 1 1 auto; display: none; align-items: center; justify-content: center; }
      .boot-globe i { display: block; width: min(46vh, 300px); aspect-ratio: 1; border-radius: 50%;
        background: var(--surface-2, #161d2e); animation: boot-pulse 1.5s ease-in-out infinite; }
      :root[data-view='graph'] .boot-map { display: none }
      :root[data-view='graph'] .boot-graph { display: flex }
      :root[data-view='globe'] .boot-map { display: none }
      :root[data-view='globe'] .boot-globe { display: flex }
      .boot-panel { flex: 0 0 390px; border-left: 1px solid var(--line, #1d2433);
        background: var(--bg-panel, #0c1120); padding: 22px 24px; display: flex;
        flex-direction: column; gap: 12px; }
      .boot-tile, .boot-line {
        border-radius: 8px;
        background: var(--surface-2, #161d2e);
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      .boot-line { height: 12px; border-radius: 4px; }
      .boot-line.w1 { width: 60%; height: 22px; }
      .boot-line.w2 { width: 85%; }
      .boot-line.w3 { width: 72%; }
      .boot-tile:nth-child(2) { animation-delay: 90ms }
      .boot-tile:nth-child(3) { animation-delay: 180ms }
      .boot-tile:nth-child(4) { animation-delay: 270ms }
      .boot-tile:nth-child(5) { animation-delay: 360ms }
      .boot-tile:nth-child(6) { animation-delay: 450ms }
      .boot-graph .col .card:nth-child(2) { animation-delay: 110ms }
      .boot-graph .col .card:nth-child(3) { animation-delay: 220ms }
      .boot-graph .col .card:nth-child(4) { animation-delay: 330ms }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.4 } 50% { opacity: 0.85 } }
      @media (prefers-reduced-motion: reduce) {
        .boot-tile, .boot-line, .boot-graph .card, .boot-globe i { animation: none; opacity: 0.6 }
      }
      @media (max-width: 860px) {
        .boot-body { flex-direction: column }
        .boot-panel { flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--line, #1d2433) }
        .boot-map, .boot-graph, .boot-globe { flex: 0 0 46vh }
        .boot-graph { gap: 22px; padding: 18px }
      }
    </style>

    <!--
      Pick the theme before anything paints, or a reader who prefers light gets a
      flash of the dark ground. Deliberately the same rule as src/lib/theme.ts —
      an explicit choice wins, otherwise the device, and anything undetectable
      means light. Change the two together.
    -->
    <script>
      try {
        var saved = localStorage.getItem('il.theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {
        /* blocked storage: React will settle the theme a moment later */
      }

      /*
       * And which view is about to render, so the skeleton draws that shape
       * rather than the other one. Same key and same default as App.tsx, which
       * opens on the graph unless told otherwise.
       */
      try {
        var v = localStorage.getItem('il.view')
        document.documentElement.dataset.view =
          v === 'cards' || v === 'globe' ? v : 'graph'
      } catch (e) {
        document.documentElement.dataset.view = 'graph'
      }
    </script>
  </head>
  <body>
    <!-- Replaced the moment React mounts into #root. -->
    <div id="root">
      <div class="boot" role="status" aria-label="Loading the atlas">
        <div class="boot-bar"><span class="boot-mark"></span><span class="boot-name">AI Atlas</span></div>
        <div class="boot-body">
          <div class="boot-map">
            <i class="boot-tile"></i><i class="boot-tile"></i><i class="boot-tile"></i>
            <i class="boot-tile"></i><i class="boot-tile"></i><i class="boot-tile"></i>
          </div>
          <div class="boot-graph">
            <div class="col root"><i class="card"></i></div>
            <div class="col">
              <i class="card"></i><i class="card"></i><i class="card"></i><i class="card"></i>
            </div>
          </div>
          <div class="boot-globe"><i></i></div>
          <div class="boot-panel">
            <i class="boot-line w1"></i><i class="boot-line w2"></i>
            <i class="boot-line w3"></i><i class="boot-line w2"></i>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
