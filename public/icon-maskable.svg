<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Atlas">
  <!--
    Android adaptive icons crop to a circle inscribed in the middle ~80%, so the
    same mark is drawn smaller inside a full-bleed ground.
  -->
  <rect width="64" height="64" fill="#0f1524"/>
  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <rect x="8"  y="8"  width="27" height="27" rx="4" fill="#a78bfa"/>
    <rect x="38" y="8"  width="18" height="27" rx="4" fill="#22d3ee"/>
    <rect x="8"  y="38" width="18" height="18" rx="4" fill="#fb923c"/>
    <rect x="29" y="38" width="12" height="18" rx="3.5" fill="#4ade80"/>
    <rect x="44" y="38" width="12" height="18" rx="3.5" fill="#f472b6"/>
  </g>
</svg>
